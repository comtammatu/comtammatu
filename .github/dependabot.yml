# Dependabot configuration for Cơm Tấm Má Tư
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Two ecosystems:
#   - npm (pnpm uses this ecosystem identifier; the root pnpm-lock.yaml is monitored)
#   - github-actions (workflow files under .github/workflows/)
#
# Strategy: monthly cadence, bundled groups (so we don't get 1-PR-per-package noise),
# capped at 5 open PRs to keep the queue reviewable for a single owner.

version: 2

updates:
  # ---- npm (pnpm workspace root) ----
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 5
    target-branch: "main"
    reviewers:
      - "comtammatu"
    assignees:
      - "comtammatu"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    versioning-strategy: "increase"
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Major-version bumps land via deliberate upgrade PRs, not Dependabot.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # ---- GitHub Actions (.github/workflows/*) ----
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 3
    target-branch: "main"
    reviewers:
      - "comtammatu"
    assignees:
      - "comtammatu"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
