name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Supabase env is read lazily at request time (packages/database/src/
      # supabase/_env.ts), never required to compile. Placeholders keep any
      # build-time prerender path from throwing on a missing URL.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      TURBO_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      # Fail closed when a T2/T3 PR lacks or under-declares its review tier.
      REVIEW_TIER_STRICT: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so check-review-tier can merge-base against origin/main;
          # a shallow clone makes the base unreachable and the guard self-skips.
          fetch-depth: 0

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm deps:audit

      - run: pnpm lint:baseline

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

  # PR-only path filter for the two docker jobs below (each stands up Supabase
  # Local — the slow part of CI). Skip them when the diff can't affect what they
  # cover. On push to main both always run, so a PR that skipped via shared code
  # the filter couldn't see is still caught at merge.
  detect:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      db: ${{ steps.filter.outputs.db }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          FILES=$(git diff --name-only "origin/$BASE_REF...HEAD")
          echo "changed files:"; echo "$FILES"
          db=false; code=false
          if echo "$FILES" | grep -qE '^supabase/'; then db=true; fi
          if echo "$FILES" | grep -qE '^(apps/|packages/|supabase/|package\.json|pnpm-lock\.yaml|turbo\.json)'; then code=true; fi
          echo "db=$db" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # Separate job (does not block the fast gates): replays the self-contained
  # baseline (public + private) on a from-empty Supabase Local (docker) so a
  # fresh-env regression — e.g. the baseline referencing a private.* object it
  # never creates — fails CI. The forward chain is squashed into this baseline
  # (see the re-baseline runbook).
  baseline-replay:
    needs: detect
    if: >-
      always() &&
      (github.event_name == 'push' || needs.detect.outputs.db == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:baseline:local-check -- --api-port=55441 --db-port=55442 --shadow-port=55440

  # Separate job (does not block the fast gates): stands up a from-empty Supabase
  # Local with the self-contained baseline + dev/QA seeds, starts the app, and runs
  # the Playwright POS->payment->KDS smoke. This is the first automated end-to-end
  # run of the order/payment hot path against a real (local) database + RPCs.
  e2e-smoke:
    needs: detect
    if: >-
      always() &&
      (github.event_name == 'push' || needs.detect.outputs.code == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/supabase-e2e-bringup.mjs
      - run: pnpm --filter @comtammatu/web exec playwright install --with-deps chromium
      # Production build so the heavy POS route is pre-compiled; `next dev`
      # compiles it on-demand, which blows the smoke's timeout. The bring-up
      # already wrote .env.local pointing at the local stack, so the build inlines
      # the right NEXT_PUBLIC_SUPABASE_URL and `next start` serves against it.
      - run: pnpm --filter @comtammatu/web build
      # Scoped to the POS->payment->KDS core (payment-cash) — the deterministic
      # hot-path smoke. The broader suite (guides/visual/inventory RBAC/realtime
      # KDS) needs more seed/setup and is out of scope for a fast CI gate.
      - run: pnpm --filter @comtammatu/web run test:e2e:smoke
        env:
          E2E_WEB_COMMAND: pnpm start
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-smoke-results
          path: apps/web/test-results
          retention-days: 3
          if-no-files-found: ignore
