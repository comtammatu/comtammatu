name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Supabase env is read lazily at request time (packages/database/src/
      # supabase/_env.ts), never required to compile. Placeholders keep any
      # build-time prerender path from throwing on a missing URL.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      TURBO_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      # Fail-closed review-tier floor for T3-blast-radius diffs (auth, money,
      # migrations, definer RPCs) lacking a tier note. Owner decision 2026-06-22.
      REVIEW_TIER_STRICT: "1"
      # Fail-closed staleness guard: snapshot docs (docs/plan, docs/worklog)
      # must declare "Reconciled-through <sha>". Owner decision 2026-06-22.
      DOC_STALENESS_STRICT: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so check-review-tier can merge-base against origin/main;
          # a shallow clone makes the base unreachable and the guard self-skips.
          fetch-depth: 0

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm deps:audit

      - run: pnpm lint:baseline

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

  # Separate job (does not block the fast gates): replays the self-contained
  # baseline (public + private) on a from-empty Supabase Local (docker) so a
  # fresh-env regression — e.g. the baseline referencing a private.* object it
  # never creates — fails CI. The forward chain is squashed into this baseline
  # (see the re-baseline runbook).
  baseline-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:baseline:local-check

  # Separate job (does not block the fast gates): stands up a from-empty Supabase
  # Local with the self-contained baseline + dev/QA seeds, starts the app, and runs
  # the Playwright POS->payment->KDS smoke. This is the first automated end-to-end
  # run of the order/payment hot path against a real (local) database + RPCs.
  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/supabase-e2e-bringup.mjs
      - run: pnpm --filter @comtammatu/web exec playwright install --with-deps chromium
      # Production build so the heavy POS route is pre-compiled; `next dev`
      # compiles it on-demand, which blows the smoke's timeout. The bring-up
      # already wrote .env.local pointing at the local stack, so the build inlines
      # the right NEXT_PUBLIC_SUPABASE_URL and `next start` serves against it.
      - run: pnpm --filter @comtammatu/web build
      # Scoped to the POS->payment->KDS core (payment-cash) — the deterministic
      # hot-path smoke. The broader suite (guides/visual/inventory RBAC/realtime
      # KDS) needs more seed/setup and is out of scope for a fast CI gate.
      - run: pnpm --filter @comtammatu/web run test:e2e:smoke
        env:
          E2E_WEB_COMMAND: pnpm start
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-results
          path: apps/web/test-results
          retention-days: 3
          if-no-files-found: ignore
