name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitattributes'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitattributes'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Supabase env is read lazily at request time (packages/database/src/
      # supabase/_env.ts), never required to compile. Placeholders keep any
      # build-time prerender path from throwing on a missing URL.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      TURBO_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          # Merge-base guards such as i18n no-growth require the PR base ref.
          fetch-depth: 0

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify

  # Path filter for the two docker jobs below (each stands up Supabase
  # Local — the slow part of CI). Skip them when the diff can't affect what they
  # cover.
  detect:
    runs-on: ubuntu-latest
    outputs:
      db: ${{ steps.filter.outputs.db }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_REF" ]; then
            FILES=$(git diff --name-only "origin/$BASE_REF...HEAD")
          else
            FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git diff --name-only HEAD)
          fi
          echo "changed files:"; echo "$FILES"
          db=false; code=false
          if echo "$FILES" | grep -qE '^supabase/'; then db=true; fi
          if echo "$FILES" | grep -qE '^(apps/|packages/|scripts/|supabase/|\.github/workflows/|package\.json$|pnpm-lock\.yaml$|turbo\.json$)'; then code=true; fi
          echo "db=$db" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # Separate job (does not block the fast gates): replays the self-contained
  # baseline (public + private) on a from-empty Supabase Local (docker) so a
  # fresh-env regression — e.g. the baseline referencing a private.* object it
  # never creates — fails CI. The forward chain is squashed into this baseline
  # (see the re-baseline runbook).
  baseline-replay:
    needs: detect
    if: >-
      (github.event_name == 'pull_request' && needs.detect.outputs.db == 'true') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:baseline:local-check -- --api-port=55441 --db-port=55442 --shadow-port=55440

  # Separate job (does not block the fast gates): the CI-only E2E harness starts
  # an isolated Supabase stack with baseline + dev/QA seeds, starts the app, and
  # runs deterministic payment and ingredient-conversion smoke coverage. It
  # never changes workspace env.
  e2e-smoke:
    needs: detect
    if: >-
      (github.event_name == 'pull_request' && needs.detect.outputs.code == 'true') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: supabase-bringup
        run: node scripts/supabase-e2e-bringup.mjs
      - run: pnpm db:test
      - run: node scripts/hddt-buyer-race-test.mjs
        timeout-minutes: 5
      - run: node scripts/finance-transfer-intent-race-test.mjs
        timeout-minutes: 5
      - run: pnpm --filter @comtammatu/web exec playwright install --with-deps chromium
      # Production build so the heavy POS route is pre-compiled; `next dev`
      # compiles it on-demand, which blows the smoke's timeout. The dedicated
      # E2E scripts consume only apps/web/.env.test.local.
      - id: build-e2e
        run: pnpm --filter @comtammatu/web build:e2e
      # One Playwright invocation covers the payment hot path and the isolated
      # ingredient unit-conversion graph without starting a second web server.
      - run: pnpm --filter @comtammatu/web run test:e2e:smoke
        env:
          E2E_WEB_COMMAND: pnpm start:e2e
      # Má Tư Design System visual baselines (theme-baseline.spec.ts). Runs on
      # the same pre-built production server setup (zero extra build cost).
      # Gated on the infra step outcomes (supabase bringup + production build)
      # so an upstream infra failure does not produce a secondary visual red
      # that masks the root cause — while staying independent of the smoke
      # TEST step's result, since the broader e2e surface on main carries
      # known pre-existing failures (branch-shell-routes.spec.ts) that must
      # not mask visual signal.
      # The step self-skips until committed Linux baselines exist, so this
      # wiring never turns the job red on missing snapshots.
      #
      # Linux baseline bootstrap (one-time, human-supervised — NEVER leave
      # --update-snapshots enabled in CI afterwards):
      #   1. Push the branch, then temporarily edit this step's script args to
      #      add `--update-snapshots` for ONE CI pass, plus an artifact upload
      #      of apps/web/e2e/visual/__screenshots__/ (snapshots are written
      #      there directly, not into test-results).
      #   2. Download the 10 Linux PNGs (5 routes × light/night) from that
      #      run's artifact.
      #   3. Human-review each PNG, then commit them under
      #      apps/web/e2e/visual/__screenshots__/.
      #   4. Revert this step to comparison mode.
      - name: theme visual baselines
        if: >-
          !cancelled() &&
          steps.supabase-bringup.outcome == 'success' &&
          steps.build-e2e.outcome == 'success' &&
          hashFiles('apps/web/e2e/visual/__screenshots__/*.png') != ''
        run: pnpm --filter @comtammatu/web run test:e2e:smoke
        env:
          E2E_WEB_COMMAND: pnpm start:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-smoke-results
          path: apps/web/test-results
          retention-days: 3
          if-no-files-found: ignore
