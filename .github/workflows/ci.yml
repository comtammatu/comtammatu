name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: read
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Supabase env is read lazily at request time (packages/database/src/
      # supabase/_env.ts), never required to compile. Placeholders keep any
      # build-time prerender path from throwing on a missing URL.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      TURBO_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      # Fail closed when a T2/T3 PR lacks or under-declares its review tier.
      REVIEW_TIER_STRICT: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so check-review-tier can merge-base against origin/main;
          # a shallow clone makes the base unreachable and the guard self-skips.
          fetch-depth: 0

      # Reads the pnpm version from package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm deps:audit

      - run: pnpm lint:baseline

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

  # PR-only path filter for the fail-closed Supabase Preview gate.
  detect:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      db: ${{ steps.filter.outputs.db }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          FILES=$(git diff --no-renames --name-only "origin/$BASE_REF...HEAD")
          echo "changed files:"; echo "$FILES"
          db=false
          if echo "$FILES" | grep -qE '^supabase/'; then db=true; fi
          echo "db=$db" >> "$GITHUB_OUTPUT"

  supabase-preview-required:
    needs: detect
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Require literal Supabase Preview success for database changes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DATABASE_CHANGED: ${{ needs.detect.outputs.db }}
          DETECT_RESULT: ${{ needs.detect.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SUPABASE_APP_ID: "330661"
          SUPABASE_PROJECT_REF: iexwsuaqqenyjiskawoj
        with:
          retries: 3
          script: |
            if (process.env.DETECT_RESULT !== "success") {
              core.setFailed(`detect job ended with ${process.env.DETECT_RESULT}`);
              return;
            }

            if (process.env.DATABASE_CHANGED !== "true") {
              core.info("No supabase/** changes; Preview gate is not required.");
              return;
            }

            const deadline = Date.now() + 10 * 60 * 1000;
            while (Date.now() < deadline) {
              const { data } = await github.rest.checks.listForRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: process.env.HEAD_SHA,
                app_id: Number(process.env.SUPABASE_APP_ID),
                filter: "latest",
                per_page: 100,
              });
              const preview = data.check_runs
                .filter((run) => {
                  let detailsUrl;
                  try {
                    detailsUrl = new URL(run.details_url ?? "");
                  } catch {
                    return false;
                  }
                  const matchingPullRequest = run.pull_requests?.some(
                    (pullRequest) =>
                      pullRequest.number === Number(process.env.PR_NUMBER) &&
                      pullRequest.head?.ref === process.env.HEAD_REF &&
                      pullRequest.head?.sha === process.env.HEAD_SHA,
                  );
                  return (
                    run.name === "Supabase Preview" &&
                    run.app?.id === Number(process.env.SUPABASE_APP_ID) &&
                    run.app?.slug === "supabase" &&
                    run.head_sha === process.env.HEAD_SHA &&
                    matchingPullRequest &&
                    detailsUrl.hostname === "supabase.com" &&
                    detailsUrl.pathname.startsWith(
                      `/dashboard/project/${process.env.SUPABASE_PROJECT_REF}/branches`,
                    )
                  );
                })
                .sort((left, right) => right.id - left.id)[0];

              if (preview?.status === "completed") {
                if (preview.conclusion === "success") {
                  core.info(`Supabase Preview succeeded on ${process.env.HEAD_SHA}.`);
                  return;
                }
                if (!["skipped", "neutral"].includes(preview.conclusion ?? "")) {
                  core.setFailed(
                    `Supabase Preview concluded ${preview.conclusion ?? "without a conclusion"} on ${process.env.HEAD_SHA}.`,
                  );
                  return;
                }
              }

              await new Promise((resolve) => setTimeout(resolve, 15_000));
            }

            core.setFailed(
              `Supabase Preview did not complete successfully on ${process.env.HEAD_SHA} within 10 minutes.`,
            );
