version: "2"
sql:
  - engine: "postgresql"
    queries: "./internal/queries"
    schema: "../../supabase/migrations"
    gen:
      go:
        package: "sqlcdb"
        out: "./internal/db/sqlc"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_sql_as_prepared_stmt: false
