<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Grab POS Relay</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 320px;
      margin: 0;
      padding: 12px 14px;
      background: #0f172a;
      color: #f8fafc;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .title-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .title {
      font-weight: 700;
      font-size: 14px;
      color: #38bdf8;
    }
    .version-badge {
      font-size: 10px;
      font-weight: 600;
      color: #94a3b8;
      background: #1e293b;
      border: 1px solid #334155;
      padding: 1px 5px;
      border-radius: 4px;
    }
    .status {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 9999px;
      background: #064e3b;
      color: #34d399;
      font-weight: 600;
    }
    .field {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 6px 8px;
      color: #f8fafc;
      font-size: 12px;
    }
    input:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .btn-group {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      margin-bottom: 8px;
    }
    button {
      flex: 1;
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary {
      background: #0284c7;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #0369a1;
    }
    .btn-secondary {
      background: #334155;
      color: #e2e8f0;
    }
    .btn-secondary:hover {
      background: #475569;
    }
    .btn-action {
      width: 100%;
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #0284c7;
      margin-bottom: 12px;
    }
    .btn-action:hover {
      background: #0369a1;
      color: #ffffff;
    }
    .recent-header {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 6px;
      border-top: 1px solid #334155;
      padding-top: 8px;
    }
    .order-list {
      max-height: 140px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .order-item {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 11px;
    }
    .order-top {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 2px;
    }
    .order-badge {
      color: #38bdf8;
    }
    .order-desc {
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .empty-state {
      text-align: center;
      color: #64748b;
      padding: 12px 0;
      font-size: 12px;
    }
    .toast {
      display: none;
      margin-top: 6px;
      font-size: 11px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-wrap">
      <div class="title">Grab POS Relay</div>
      <span class="version-badge" id="extVersion">v1.1.2</span>
    </div>
    <div class="status" id="liveStatus">SẴN SÀNG</div>
  </div>

  <div class="field">
    <label for="backendUrl">Địa chỉ máy chủ POS</label>
    <input type="text" id="backendUrl" placeholder="http://localhost:3000 hoặc https://web.comtammatu.com" />
  </div>

  <div class="field">
    <label for="branchId">Mã Chi Nhánh (Branch ID)</label>
    <input type="number" id="branchId" placeholder="1" />
  </div>

  <div class="field">
    <label for="relaySecret">Khóa bảo mật Relay Secret (Tùy chọn)</label>
    <input type="password" id="relaySecret" placeholder="Nhập secret key nếu có" />
  </div>

  <div class="btn-group">
    <button class="btn-secondary" id="btnPing">Kiểm tra kết nối</button>
    <button class="btn-primary" id="btnSave">Lưu cấu hình</button>
  </div>

  <button class="btn-action" id="btnSyncMenu">🔄 Đồng bộ toàn bộ Menu sang Grab</button>

  <div class="toast" id="toast"></div>

  <div class="recent-header">Đơn hàng Grab gần nhất</div>
  <div class="order-list" id="orderList">
    <div class="empty-state">Chưa có đơn hàng nào</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
