<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Grab POS Relay</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 320px;
      margin: 0;
      padding: 12px 14px;
      background: #0f172a;
      color: #f8fafc;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .title {
      font-weight: 700;
      font-size: 14px;
      color: #38bdf8;
    }
    .status {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 9999px;
      background: #064e3b;
      color: #34d399;
      font-weight: 600;
    }
    .field {
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      background: #1e293b;
      border: 1px solid #475569;
      border-radius: 6px;
      padding: 6px 8px;
      color: #f8fafc;
      font-size: 12px;
    }
    input:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .btn-group {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      margin-bottom: 12px;
    }
    button {
      flex: 1;
      padding: 6px 10px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary {
      background: #0284c7;
      color: #ffffff;
    }
    .btn-primary:hover {
      background: #0369a1;
    }
    .btn-secondary {
      background: #334155;
      color: #e2e8f0;
    }
    .btn-secondary:hover {
      background: #475569;
    }
    .recent-header {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      margin-bottom: 6px;
      border-top: 1px solid #334155;
      padding-top: 8px;
    }
    .order-list {
      max-height: 140px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .order-item {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 6px 8px;
    }
    .order-row {
      display: flex;
      justify-content: space-between;
      font-weight: 600;
      color: #f1f5f9;
    }
    .order-sub {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .empty-msg {
      font-size: 12px;
      color: #64748b;
      text-align: center;
      padding: 10px 0;
    }
    #toast {
      margin-top: 6px;
      font-size: 11px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">Cơm Tấm Má Tư POS</div>
    <div class="status" id="statusBadge">🟢 Sẵn Sàng</div>
  </div>

  <div class="field">
    <label for="backendUrl">Địa chỉ máy chủ POS:</label>
    <input type="text" id="backendUrl" placeholder="http://localhost:3000">
  </div>

  <div class="field">
    <label for="branchId">Chi nhánh (Branch ID):</label>
    <input type="number" id="branchId" placeholder="1">
  </div>

  <div class="btn-group">
    <button class="btn-primary" id="btnSave">Lưu Cài Đặt</button>
    <button class="btn-secondary" id="btnPing">Test Kết Nối</button>
  </div>

  <div id="toast"></div>

  <div class="recent-header">Đơn Grab Mới Nhận</div>
  <div class="order-list" id="orderList">
    <div class="empty-msg">Chưa có đơn hàng nào</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
