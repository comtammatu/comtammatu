# Codex reads AGENTS.md natively as the agent entrypoint
# (see docs/agent/rules/references.md -> "Agent Entrypoints Per IDE").
# Prod-DB safety: .codex/hooks.json wires scripts/guard-prod-db.mjs to block writes
# to protected refs; the Supabase MCP below is pinned read-only to the prod ref.
# Approval/sandbox posture: production defaults to file -> PR -> owner apply;
# exact owner-delegated operations still require a scoped path that does not
# disable repo guards. See docs/agent/rules/database.md Environment Registry.

[mcp_servers.supabase]
url = "https://mcp.supabase.com/mcp?project_ref=enloyfnuerqgaqderbwb&read_only=true&features=database,debugging,development,docs"

[mcp_servers.vercel]
url = "https://mcp.vercel.com"

[mcp_servers.openrouter]
url = "https://mcp.openrouter.ai/mcp"

[mcp_servers.stitch]
command = "npx"
args = ["-y", "@_davideast/stitch-mcp", "proxy"]

[mcp_servers.codegraph]
command = "codegraph"
args = ["serve", "--mcp"]
