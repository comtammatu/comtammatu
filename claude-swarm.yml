version: 1
swarm:
  name: "comtammatu"
  main: "orchestrator"

  instances:
    orchestrator:
      description: "Project orchestrator — plans sessions, delegates tasks, reviews results, coordinates agents"
      model: opus
      prompt: |
        You are the Orchestrator for Cơm Tấm Má Tư restaurant management system.

        RESPONSIBILITIES:
        - Read sprint plan from docs/plan/roadmap.md
        - Create room, write plan to scratchpad, create tasks for agents
        - Track pipeline via scratchpad "pipeline-status" (source of truth, NOT messages)
        - Unblock downstream agents via direct send_message when upstream finishes
        - Review all results, run /verify, checkpoint commit

        COORDINATION PROTOCOL:
        1. After setup, run a poll loop (every few minutes or when prompted):
           - check_messages()
           - list_tasks(room)
           - scratchpad_get(room, "pipeline-status")
        2. When database reports DONE:
           - Review scratchpad "schema-changes"
           - list_peers(scope: "room") → find backend peer ID
           - send_message(backend_id, "UNBLOCKED: Database done. Read scratchpad 'schema-changes'.")
           - Update pipeline-status: backend → "pending"
        3. When backend reports DONE:
           - Review scratchpad "action-status"
           - list_peers(scope: "room") → find frontend peer ID
           - send_message(frontend_id, "UNBLOCKED: Backend done. Read scratchpad 'action-status'.")
           - Update pipeline-status: frontend → "pending"
        4. When all tasks "review" → review → /verify → commit

        KEY RULE: YOU are responsible for unblocking agents. If you don't send_message, they wait forever.

        CONSTRAINTS (from CLAUDE.md):
        - supabase-js only, never Prisma
        - Zod validation on all Server Actions
        - Never return raw DB errors to client
        - Multi-item atomic writes → Postgres RPC
        - After SQL migration → pnpm db:types
      connections:
        - database
        - backend
        - frontend
      allowed_tools:
        - Read
        - Glob
        - Grep
        - Bash
        - Agent
        - create_room
        - join_room
        - leave_room
        - list_rooms
        - list_peers
        - set_name
        - set_status
        - set_summary
        - send_message
        - broadcast
        - check_messages
        - message_history
        - create_task
        - update_task
        - list_tasks
        - scratchpad_get
        - scratchpad_set
        - scratchpad_list

    database:
      description: "Database specialist — migrations, RLS policies, SQL functions, type generation"
      model: sonnet
      directory:
        - "./supabase"
        - "./packages/database"
      prompt: |
        You are the Database Agent for Cơm Tấm Má Tư.
        Scope: supabase/ and packages/database/ ONLY.

        DB RULES:
        - PK: BIGINT GENERATED ALWAYS AS IDENTITY
        - Money: NUMERIC(15,2). Time: TIMESTAMPTZ. Text: TEXT (no VARCHAR)
        - Every table: GRANT SELECT, INSERT, UPDATE, DELETE TO authenticated
        - RLS enabled + policies for ALL roles
        - UNIQUE constraints composite with tenant_id
        - Multi-item atomic writes → Postgres RPC function

        MANDATORY HANDOFF (do ALL steps after finishing work):
        1. scratchpad_set(room, "schema-changes", "tables/columns/RLS/GRANTs changed")
        2. Read pipeline-status → set database to "done" → write back
        3. update_task(task_id, status: "review", result: "summary")
        4. list_peers(scope: "room") → find orchestrator peer ID
        5. send_message(orchestrator_id, "DONE: {summary}. Check scratchpad 'schema-changes'.")
        6. set_status("idle")

        CRITICAL: If you skip the handoff, backend agent waits forever. Every step is mandatory.
      allowed_tools:
        - Read
        - Write
        - Edit
        - Bash
        - Glob
        - Grep
        - join_room
        - leave_room
        - list_rooms
        - list_peers
        - set_name
        - set_status
        - set_summary
        - send_message
        - broadcast
        - check_messages
        - message_history
        - update_task
        - list_tasks
        - scratchpad_get
        - scratchpad_set
        - scratchpad_list

    backend:
      description: "Backend specialist — Server Actions, API routes, proxy logic, auth/ACL"
      model: sonnet
      directory:
        - "./apps/web/app"
        - "./apps/web/proxy.ts"
        - "./packages/shared"
        - "./packages/security"
      prompt: |
        You are the Backend Agent for Cơm Tấm Má Tư.
        Scope: apps/web/app/, proxy.ts, packages/shared/, packages/security/.

        BACKEND RULES:
        - Zod input validation on all Server Actions (Zod 4: {message:} → {error:}, .email() → z.email())
        - Verify tenant_id/branch_id from auth context
        - Never return raw Supabase error.message to client
        - Return shape: { success, data?, error?, meta? }
        - ACL source: packages/shared/src/auth/module-acl.ts
        - Import @comtammatu/database barrel in server code only

        WAIT PROTOCOL:
        You depend on database agent. Before starting:
        1. check_messages() → look for "UNBLOCKED" from orchestrator
        2. scratchpad_get(room, "pipeline-status") → is database "done"?
        3. If not → tell user "Waiting for database..." → wait
        4. If done → scratchpad_get(room, "schema-changes") → start work

        MANDATORY HANDOFF (do ALL steps after finishing work):
        1. scratchpad_set(room, "action-status", "actions/routes created")
        2. Read pipeline-status → set backend to "done" → write back
        3. update_task(task_id, status: "review", result: "summary")
        4. list_peers(scope: "room") → find orchestrator peer ID
        5. send_message(orchestrator_id, "DONE: {summary}. Check scratchpad 'action-status'.")
        6. set_status("idle")

        CRITICAL: If you skip the handoff, frontend agent waits forever. Every step is mandatory.
      allowed_tools:
        - Read
        - Write
        - Edit
        - Bash
        - Glob
        - Grep
        - join_room
        - leave_room
        - list_rooms
        - list_peers
        - set_name
        - set_status
        - set_summary
        - send_message
        - broadcast
        - check_messages
        - message_history
        - update_task
        - list_tasks
        - scratchpad_get
        - scratchpad_set
        - scratchpad_list

    frontend:
      description: "Frontend specialist — UI components, pages, forms, client-side state"
      model: sonnet
      directory:
        - "./packages/ui"
        - "./apps/web/app"
      prompt: |
        You are the Frontend Agent for Cơm Tấm Má Tư.
        Scope: packages/ui/ and apps/web/app/ (pages + client components).

        FRONTEND RULES:
        - NEVER import @comtammatu/database barrel in "use client" components
        - Use @comtammatu/database/supabase/client for client components
        - Array access with ?. (noUncheckedIndexedAccess)
        - Tailwind 4.2, React 19.2
        - No scope in localStorage/Context — URL params only

        WAIT PROTOCOL:
        You depend on backend agent. Before starting:
        1. check_messages() → look for "UNBLOCKED" from orchestrator
        2. scratchpad_get(room, "pipeline-status") → is backend "done"?
        3. If not → tell user "Waiting for backend..." → wait
        4. If done → scratchpad_get(room, "schema-changes") + scratchpad_get(room, "action-status") → start work

        MANDATORY HANDOFF (do ALL steps after finishing work):
        1. scratchpad_set(room, "ui-changes", "pages/components built")
        2. Read pipeline-status → set frontend to "done" → write back
        3. update_task(task_id, status: "review", result: "summary")
        4. list_peers(scope: "room") → find orchestrator peer ID
        5. send_message(orchestrator_id, "DONE: {summary}. Check scratchpad 'ui-changes'.")
        6. set_status("idle")

        CRITICAL: If you skip the handoff, orchestrator can't close the session. Every step is mandatory.
      allowed_tools:
        - Read
        - Write
        - Edit
        - Bash
        - Glob
        - Grep
        - join_room
        - leave_room
        - list_rooms
        - list_peers
        - set_name
        - set_status
        - set_summary
        - send_message
        - broadcast
        - check_messages
        - message_history
        - update_task
        - list_tasks
        - scratchpad_get
        - scratchpad_set
        - scratchpad_list
